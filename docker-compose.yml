services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  ingest:
    build: ./ingest
    environment:
      MQTT_HOST: mosquitto
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_started}
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  mqttdata:
