listener 1883
allow_anonymous true          # TODO later: per-device auth / TLS

# Durability: keep queued QoS1 messages on disk across broker restarts
persistence true
persistence_location /mosquitto/data/
autosave_interval 0

# Bounded buffering for offline persistent-session clients (makes the limit explicit + testable)
max_queued_messages 100000
max_inflight_messages 20
